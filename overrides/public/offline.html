<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#183f32">
  <title>Doit · Sin conexión</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f8f5;color:#183f32;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(100%,420px);padding:32px;border:1px solid #e4ece1;border-radius:26px;background:white;box-shadow:0 20px 60px #183f3212;text-align:center}
    .mark{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 22px;border-radius:19px;background:#183f32;color:#fff;font-size:40px;font-weight:800;letter-spacing:-4px;padding:0 5px 7px 0}.mark span{color:#a9d4a8}
    h1{font-size:25px;letter-spacing:-1px;margin:0 0 10px}p{font-size:13px;line-height:1.6;color:#78877c;margin:0 0 22px}
    button{min-height:46px;padding:0 18px;border:0;border-radius:15px;background:#1d523d;color:white;font-size:12px;font-weight:700}
  </style>
</head>
<body><main><div class="mark">d<span>.</span></div><h1>Estás sin conexión.</h1><p>Doit necesita internet para sincronizar tus planes y conversaciones. Vuelve a conectarte y recarga la página para continuar.</p><button onclick="location.reload()">Volver a intentar</button></main></body>
</html>
