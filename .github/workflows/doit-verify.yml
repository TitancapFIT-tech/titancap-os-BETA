name: Doit build and PWA smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore source and apply Doit improvements
        run: node scripts/restore-bundle.mjs
      - name: Check PWA and realtime wiring
        run: |
          test -s app/layout.tsx
          test -s app/components/InstallPrompt.tsx
          test -s app/pwa-install.css
          test -s public/manifest.webmanifest
          test -s public/sw.js
          test -s public/offline.html
          grep -q "doit-user-sync-" app/page.tsx
          grep -q "doit-group-" app/page.tsx
          grep -q "beforeinstallprompt" app/components/InstallPrompt.tsx
          grep -q "DOIT_SUPABASE_URL" lib/supabase.ts
          grep -q "DOIT_PUBLISHABLE_KEY" lib/supabase.ts
          grep -q "doit-brand-image" app/page.tsx
          test -s public/doit-horizontal.svg
          test -s public/doit-icon.svg
      - name: Install dependencies
        run: npm install
      - name: Production build
        run: npm run build
      - name: Smoke test site and PWA assets
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 > /tmp/doit-next.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ -o /tmp/doit-home.html; then break; fi
            sleep 2
          done
          grep -q "Doit" /tmp/doit-home.html
          curl -fsS http://127.0.0.1:3000/manifest.webmanifest | node -e '
            let data = "";
            process.stdin.on("data", chunk => data += chunk);
            process.stdin.on("end", () => {
              const manifest = JSON.parse(data);
              if (manifest.display !== "standalone" || !manifest.icons?.length) process.exit(1);
              console.log("PWA manifest OK:", manifest.short_name);
            });
          '
          curl -fsS http://127.0.0.1:3000/sw.js | grep -q "CACHE_NAME"
          curl -fsS http://127.0.0.1:3000/doit-horizontal.svg | grep -q "Real connections"
          curl -fsS http://127.0.0.1:3000/doit-icon.svg | grep -q 'aria-label="Doit"'
          curl -fsS http://127.0.0.1:3000/favicon.svg | grep -q 'aria-label="Doit"'
